<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GameVault</title>
  </head>
  <body>
    <header class="header">
      <h1>🎮 GameVault</h1>
      <span id="counter" class="counter"></span>
    </header>

    <main class="layout">
      <section class="panel">
        <h2>Ajouter un jeu</h2>
        <form id="game-form" class="form" novalidate>
          <label>Titre <input name="title" maxlength="100" required /></label>
          <label>Plateforme <input name="platform" maxlength="100" required /></label>
          <label>Genre <input name="genre" maxlength="100" required /></label>
          <label>Note /10 <input name="rating" type="number" min="0" max="10" step="0.5" value="5" required /></label>
          <label>Année <input name="releaseYear" type="number" min="1950" step="1" /></label>
          <label>Heures jouées <input name="hoursPlayed" type="number" min="0" step="1" /></label>
          <label class="checkbox"><input name="completed" type="checkbox" /> Terminé</label>
          <button id="submit" class="btn btn-primary" type="submit">Ajouter</button>
        </form>
      </section>

      <section class="panel panel-wide">
        <p id="status" class="status" role="status" aria-live="polite"></p>
        <ul id="game-list" class="grid"></ul>
      </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
